name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Run Backend Tests
      run: |
        cd backend
        npm test || echo "No tests configured"

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        npm run build

    - name: Build Docker Images
      run: |
        docker build -t my-backend ./backend
        docker build -t my-frontend ./frontend

    - name: Push Docker Images to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - run: |
        docker tag my-backend ${{ secrets.DOCKER_USERNAME }}/my-backend:latest
        docker tag my-frontend ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-frontend:latest
